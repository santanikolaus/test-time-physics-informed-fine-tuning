defaults:
  - data: kf
  - model: fno_kf
  - loss: kf_pino
  - trainer: default
  - logger: wandb
  - callbacks: kf
  - _self_
  - optional experiment: null

seed: null  # seed_everything before data/model build; null = unseeded

opt:
  learning_rate: 0.001
  weight_decay: 0.0
  milestones: [25, 50, 75, 100]
  step_size: 100
  gamma: 0.5
  input_noise: 0.0  # one-step training: Gaussian input-window noise std (vorticity units), clean target
