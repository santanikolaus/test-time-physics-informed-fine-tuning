# @package _global_
# Variant A chaining — Re500 full-T, cold start (no pretrain weights).
# Tests whether warm-start from op500 was a bad initialization for chain training.
# W1: full PINO loss; W2: chain data loss from predicted midpoint (no stopgrad).

defaults:
  - override /callbacks: kf

module_class: KFLitModuleChain

logger:
  wandb:
    project: chain-wall-pilot
    name: re500_chain_variantA_cold

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 5

data:
  data_path: /system/user/studentwork/wehofer/data/ns/NS_fine_Re500_T128_part0.npy
  n_train: 200
  n_val: 60
  batch_size: 1
  sub_t: 2
  num_workers: 0

loss:
  re: 500
  t_interval: 1.0
  data_weight: 5.0
  pde_weight: 1.0
  ic_weight: 1.0

chain:
  m: null        # -> T // 2 = 32
  weight: 1.0
  stop_grad: false

opt:
  learning_rate: 0.001
  weight_decay: 0.0
  milestones: [50]
  gamma: 0.5

model:
  lifting_channel_ratio: 0
  hidden_channels: 128
